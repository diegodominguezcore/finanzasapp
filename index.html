<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <!-- viewport-fit=cover permite usar toda la pantalla del iPhone (incluida la zona del notch) -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Finanzas</title>

  <!-- Configuración de PWA: esto es lo que hace que se instale como app -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#f6f6f3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e0e0d" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Finanzas">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">

  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="app">
    <!-- Barra superior: navegación por mes (o título de la pestaña) + respaldo -->
    <header class="topbar">
      <span class="topbar__side"></span>
      <nav class="month-nav" id="month-nav" aria-label="Mes">
        <button class="icon-btn" id="prev-month" aria-label="Mes anterior">‹</button>
        <h1 class="topbar__title month-nav__label" id="month-label"></h1>
        <button class="icon-btn" id="next-month" aria-label="Mes siguiente">›</button>
      </nav>
      <h1 class="topbar__title" id="view-title" hidden>Ahorro y deudas</h1>
      <span class="topbar__side topbar__side--end">
        <button class="icon-btn" id="open-backup" aria-label="Respaldo de datos">⋯</button>
      </span>
    </header>

    <!-- Cada pestaña es un bloque data-view. Solo uno está visible a la vez
         (ver render() en js/app.js). Están vacíos: JavaScript los llena. -->
    <div data-view="home">
      <section class="summary" id="summary" aria-label="Resumen"></section>
      <section class="transactions" id="transaction-list" aria-label="Movimientos"></section>
    </div>

    <div data-view="dashboard" id="dashboard" hidden></div>

    <div data-view="goals" id="goals" hidden></div>
  </main>

  <button class="fab" id="open-form" aria-label="Agregar movimiento">+</button>

  <!-- Barra de pestañas inferior -->
  <nav class="tabbar" aria-label="Secciones">
    <button class="tab" data-tab="home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.5 12 4l8 7.5V19a1 1 0 0 1-1 1h-4.5v-5.5h-5V20H5a1 1 0 0 1-1-1z"/></svg>
      <span>Inicio</span>
    </button>
    <button class="tab" data-tab="dashboard">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 20v-8M12 20V5M18 20v-5"/></svg>
      <span>Resumen</span>
    </button>
    <button class="tab" data-tab="goals">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4"/></svg>
      <span>Metas</span>
    </button>
  </nav>

  <!-- Aviso temporal, por ejemplo "Movimiento eliminado · Deshacer" -->
  <div class="toast" id="toast" role="status" hidden>
    <span id="toast-message"></span>
    <button type="button" id="toast-action"></button>
  </div>

  <!-- Hoja: crear o editar un movimiento -->
  <dialog class="sheet" id="transaction-dialog">
    <form class="sheet__body" id="transaction-form" novalidate>
      <header class="sheet__header">
        <h2 id="form-title">Nuevo movimiento</h2>
        <button type="button" class="icon-btn" data-close aria-label="Cerrar">✕</button>
      </header>

      <div class="segmented" role="radiogroup" aria-label="Tipo de movimiento">
        <label><input type="radio" name="type" value="expense" checked><span>Gasto</span></label>
        <label><input type="radio" name="type" value="income"><span>Ingreso</span></label>
      </div>

      <label class="amount-field">
        <span class="amount-field__symbol">Q</span>
        <!-- inputmode="decimal" muestra el teclado numérico en el iPhone -->
        <input name="amount" type="text" inputmode="decimal" placeholder="0.00" autocomplete="off" aria-label="Monto">
      </label>

      <fieldset class="field">
        <legend>Categoría</legend>
        <div class="chips" id="category-chips"></div>
      </fieldset>

      <label class="field">
        <span>Descripción</span>
        <input name="description" type="text" maxlength="60" placeholder="Opcional" autocomplete="off" enterkeyhint="done">
      </label>

      <label class="field">
        <span>Fecha</span>
        <input name="date" type="date">
      </label>

      <p class="form-error" id="form-error" role="alert" hidden></p>

      <div class="sheet__actions">
        <button type="button" class="btn btn--danger" id="delete-transaction" hidden>Eliminar</button>
        <button type="submit" class="btn btn--primary">Guardar</button>
      </div>
    </form>
  </dialog>

  <!-- Hoja: crear o editar una meta (de ahorro o deuda) -->
  <dialog class="sheet" id="goal-dialog">
    <form class="sheet__body" id="goal-form" novalidate>
      <header class="sheet__header">
        <h2 id="goal-form-title"></h2>
        <button type="button" class="icon-btn" data-close aria-label="Cerrar">✕</button>
      </header>

      <label class="field">
        <span>Nombre</span>
        <input name="name" type="text" maxlength="40" autocomplete="off" enterkeyhint="next">
      </label>

      <label class="field">
        <span id="goal-target-label"></span>
        <input name="target" type="text" inputmode="decimal" placeholder="0.00" autocomplete="off">
      </label>

      <section class="field" id="goal-history-section" hidden>
        <span id="goal-history-title"></span>
        <ul class="history" id="goal-history"></ul>
      </section>

      <p class="form-error" id="goal-form-error" role="alert" hidden></p>

      <div class="sheet__actions">
        <button type="button" class="btn btn--danger" id="delete-goal" hidden>Eliminar</button>
        <button type="submit" class="btn btn--primary">Guardar</button>
      </div>
    </form>
  </dialog>

  <!-- Hoja: registrar un aporte (ahorro) o abono (deuda) -->
  <dialog class="sheet" id="entry-dialog">
    <form class="sheet__body" id="entry-form" novalidate>
      <header class="sheet__header">
        <h2 id="entry-form-title"></h2>
        <button type="button" class="icon-btn" data-close aria-label="Cerrar">✕</button>
      </header>

      <label class="amount-field">
        <span class="amount-field__symbol">Q</span>
        <input name="amount" type="text" inputmode="decimal" placeholder="0.00" autocomplete="off" aria-label="Monto">
      </label>
      <p class="sheet__text sheet__text--muted sheet__text--center" id="entry-hint"></p>

      <label class="field">
        <span>Fecha</span>
        <input name="date" type="date">
      </label>

      <p class="form-error" id="entry-form-error" role="alert" hidden></p>

      <div class="sheet__actions">
        <button type="submit" class="btn btn--primary">Guardar</button>
      </div>
    </form>
  </dialog>

  <!-- Hoja: respaldo de datos -->
  <dialog class="sheet" id="backup-dialog">
    <div class="sheet__body">
      <header class="sheet__header">
        <h2>Respaldo</h2>
        <button type="button" class="icon-btn" data-close aria-label="Cerrar">✕</button>
      </header>
      <p class="sheet__text">
        Tus datos se guardan solo en este dispositivo. Exporta un respaldo de vez en cuando
        para no perderlos.
      </p>
      <p class="sheet__text sheet__text--muted" id="backup-status"></p>
      <div class="sheet__actions sheet__actions--stack">
        <button type="button" class="btn btn--primary" id="export-backup">Exportar respaldo</button>
        <button type="button" class="btn" id="import-backup">Importar respaldo</button>
        <input type="file" id="import-file" accept="application/json,.json" hidden>
      </div>
    </div>
  </dialog>

  <!-- type="module" permite usar import/export entre archivos -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
